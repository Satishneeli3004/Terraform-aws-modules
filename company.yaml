kong-admin-deployment yaml

---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  ports:
  - name: admin
    port: 80
    protocol: TCP
    targetPort: 8001
  - name: admin-proxy
    port: 81
    protocol: TCP
    targetPort: 8000
  - name: admin-ssl
    port: 443
    targetPort: 8444
    protocol: TCP
  selector:
    app: kong-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kong-admin
  name: kong-admin
  namespace: kong
spec:
  selector:
    matchLabels:
      app: kong-admin
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kong-admin
    spec:
      containers:
      - name: admin-api
        image: latitudedocker/collectez:jb-aks-prod-kong-6_2024-12-02_20-33
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_DATABASE
          valueFrom:
            secretKeyRef:
              name: kongcreds
              key: postgresdbname
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              name: kongcreds
              key: username
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kongcreds
              key: password
        - name: KONG_DECLARATIVE_CONFIG
          value: /etc/kong/declarative/kong.yml
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_CASSANDRA_CONTACT_POINTS
          value: postgres
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_PREFIX
          value: /var/run/kong
        - name: KONG_PLUGINSERVER_NAMES
          value: js
        - name: KONG_PLUGINSERVER_JS_SOCKET
          value: /usr/local/kong/js_pluginserver.sock
        - name: KONG_PLUGINSERVER_JS_START_CMD
          value: /usr/local/bin/kong-js-pluginserver -v --plugins-directory /usr/local/kong/js-plugins
        - name: KONG_PLUGINSERVER_JS_QUERY_CMD
          value: /usr/local/bin/kong-js-pluginserver --plugins-directory /usr/local/kong/js-plugins --dump-all-plugins
        - name: KONG_PLUGINS
          value: bundled,digilockerredirect,querytobodyparam
        - name: KONG_LOG_LEVEL
          value: debug
        - name: REAL_IP_HEADER
          value: X-Forwarded-For
        - name: KONG_TRUSTED_IPS
          value: 0.0.0.0/0,::/0
        - name: KONG_REAL_IP_RECURSIVE
          value: "on"
        ports:
        - name: kong-admin-port
          containerPort: 8001
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /status
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/run/kong
          name: kong-prefix-vol
        - mountPath: /tmp
          name: plugins
      volumes:
      - name: kong-prefix-vol
        emptyDir: {}
      - name: plugins
        emptyDir: {}
          # affinity:
          # nodeAffinity:
          # requiredDuringSchedulingIgnoredDuringExecution:
          # nodeSelectorTerms:
          # - matchExpressions:
          #   - key: special
          #     operator: In
          #     values:
          #     - "true"
      imagePullSecrets:
      - name: regcred
---
# autoscaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong-admin
  namespace: kong
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong-admin
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 300000000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 1
        periodSeconds: 15


