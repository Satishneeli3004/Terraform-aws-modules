MySQL deployment file

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pv-claim
  namespace: ak-dr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ak-dr
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - image: mysql:5.7.31
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "keYcloAkArd"
        - name: MYSQL_DATABASE
          value: "keyclak"
        - name: MYSQL_USER
          value: "keyclak"
        - name: MYSQL_PASSWORD
          value: "ak76ryg"
        - name: MYSQL_ROOT_HOST
          value: "%"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: ak-dr
spec:
  type: NodePort
  ports:
  - port: 3306
  selector:
    app: mysql



